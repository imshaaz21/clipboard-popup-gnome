name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: sudo apt-get install -y --no-install-recommends libglib2.0-bin gjs

      - name: Regression tests
        run: make test

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict --dry-run extension/schemas

      - name: Check JavaScript syntax
        run: |
          for f in extension/*.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done

      - name: Run Shexli (extensions.gnome.org review checks)
        run: |
          pip install -q shexli==0.2.1 tree-sitter==0.25.2 tree-sitter-javascript==0.25.0
          (cd extension && zip -qr ../extension.zip . -x 'schemas/gschemas.compiled')
          shexli extension.zip
          shexli --format json extension.zip | jq -e '.summary.severity_counts | (.error // 0) == 0 and (.warning // 0) == 0'

      - name: Check metadata
        run: |
          jq -e '.uuid and .name and .description and (."shell-version" | length > 0) and ."settings-schema"' extension/metadata.json
          test ! -e extension/stylesheet.css
