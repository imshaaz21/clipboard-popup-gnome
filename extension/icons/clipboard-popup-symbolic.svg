  <rect x="6.9" y="1.9" width="2.2" height="0.9" rx="0.45" fill="#fff"/>
  <!-- text lines on the sheet -->
  <rect x="5" y="5.8" width="6" height="1.1" rx="0.55"/>
  <rect x="5" y="7.9" width="6" height="1.1" rx="0.55"/>
  <rect x="5" y="10" width="3.4" height="1.1" rx="0.55"/>
  <!-- pointer arrow marking the popup-at-cursor idea -->
  <path d="M11.6 8.6 L15.4 10.9 L12.9 11.4 L14.6 14.6 L13.4 15.3 L11.8 12.2 L9.9 13.9 Z" fill="#000" stroke="#fff" stroke-width="0.7" stroke-linejoin="round"/>
