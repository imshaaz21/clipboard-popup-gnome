<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="#000">
  <!-- clipboard body -->
  <rect x="2" y="2.5" width="12" height="12" rx="1.5"/>
  <!-- punched-out sheet so the icon reads as a clipboard -->
  <rect x="4" y="4.5" width="8" height="8" rx="0.8" fill="#fff"/>
